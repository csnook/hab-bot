[package]
name = "hab-app"
description = "The Linux desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hab-client = { path = "../../crates/client" }
hab-core = { path = "../../crates/core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync"] }
tauri = { version = "2", features = [] }
zbus = "5"
tauri-plugin-single-instance = "2"
gtk = "0.18"
# Raising the alarm window on Wayland: our own xdg-activation token requests
# (no library passes one on to the window).
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[dev-dependencies]
tempfile = "3"
