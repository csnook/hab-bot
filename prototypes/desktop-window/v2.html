<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Reminders Desktop Window</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans:wght@400;500;600;700&display=swap">
<style>
/* PROTOTYPE, throwaway, version 2. One window for csnook/hab-bot#26 with four views (#inbox, #calendar, #agenda, #board).
   Layout: a Plasma desk holding one Breeze-styled app window and a tray; prototype controls sit outside the window in mono type. */
:root {
  --desk: #cfd6dd;
  --win: #eff0f1;
  --view: #fcfcfc;
  --line: #d3d7db;
  --fg: #232629;
  --muted: #677079;
  --faint: #9aa1a8;
  --accent: #2c93cf;
  --accent-soft: rgba(61, 174, 233, 0.14);
  --neg: #d33a4b;
  --neg-soft: rgba(218, 68, 83, 0.12);
  --pos: #238a4f;
  --wait: #b86a00;
  --wait-soft: rgba(246, 116, 0, 0.12);
  --cal: rgba(35, 38, 41, 0.06);
  --cal-edge: rgba(35, 38, 41, 0.28);
  --l-personal: #1d99f3;
  --l-household: #9b59b6;
  --l-garden: #11a08a;
  --chrome-bg: #1d2126;
  --chrome-fg: #f3f5f7;
  --chrome-muted: #aab2ba;
  --shadow: 0 18px 50px rgba(20, 30, 40, 0.22), 0 2px 6px rgba(20, 30, 40, 0.12);
  --ui: "Noto Sans", "Noto Sans UI", system-ui, sans-serif;
  --proto: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --desk: #121417; --win: #2a2e32; --view: #1e2124; --line: #3b4148; --fg: #f2f4f5; --muted: #a3acb4; --faint: #6d757d;
    --accent: #3daee9; --accent-soft: rgba(61, 174, 233, 0.18); --neg: #f0596a; --neg-soft: rgba(240, 89, 106, 0.16);
    --pos: #46c27a; --wait: #f39c3c; --wait-soft: rgba(243, 156, 60, 0.16); --cal: rgba(252, 252, 252, 0.06); --cal-edge: rgba(252, 252, 252, 0.3);
    --l-personal: #3daee9; --l-household: #b77fd0; --l-garden: #2ec4a6;
    --chrome-bg: #eef1f4; --chrome-fg: #16191c; --chrome-muted: #4f575f;
    --shadow: 0 18px 50px rgba(0, 0, 0, 0.55), 0 2px 6px rgba(0, 0, 0, 0.4);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --desk: #121417; --win: #2a2e32; --view: #1e2124; --line: #3b4148; --fg: #f2f4f5; --muted: #a3acb4; --faint: #6d757d;
  --accent: #3daee9; --accent-soft: rgba(61, 174, 233, 0.18); --neg: #f0596a; --neg-soft: rgba(240, 89, 106, 0.16);
  --pos: #46c27a; --wait: #f39c3c; --wait-soft: rgba(243, 156, 60, 0.16); --cal: rgba(252, 252, 252, 0.06); --cal-edge: rgba(252, 252, 252, 0.3);
  --l-personal: #3daee9; --l-household: #b77fd0; --l-garden: #2ec4a6;
  --chrome-bg: #eef1f4; --chrome-fg: #16191c; --chrome-muted: #4f575f;
  --shadow: 0 18px 50px rgba(0, 0, 0, 0.55), 0 2px 6px rgba(0, 0, 0, 0.4);
  color-scheme: dark;
}

html, body { background: var(--desk); color: var(--fg); }
body { font-family: var(--ui); padding: 0 16px 96px; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
button:focus-visible, [tabindex]:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tnum { font-variant-numeric: tabular-nums; }

/* ---------- prototype chrome (not part of the design) ---------- */
.proto-head { max-width: 1180px; margin: 0 auto; padding-block: 28px 18px; display: grid; gap: 10px; font-family: var(--proto); }
.proto-eyebrow { font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.proto-head h1 { font-family: var(--ui); font-size: 26px; font-weight: 700; margin: 0; text-wrap: balance; }
.proto-head p { margin: 0; max-width: 78ch; font-size: 13px; line-height: 1.6; color: var(--muted); }
.proto-variants { display: flex; flex-wrap: wrap; gap: 8px; }
.proto-variants button { border: 1px solid var(--line); background: var(--view); border-radius: 6px; padding: 8px 12px; cursor: pointer; text-align: left; font-family: var(--proto); font-size: 12px; line-height: 1.45; max-width: 360px; min-width: 0; }
.proto-variants button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.proto-variants b { font-family: var(--ui); font-size: 13px; }
.desk-scroll { overflow-x: auto; padding-block: 8px 24px; }
.desk { width: 1212px; margin: 0 auto; display: grid; gap: 14px; justify-items: center; }
.switcher { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 50;
  display: flex; align-items: center; gap: 4px; padding: 6px; border-radius: 999px; background: var(--chrome-bg); color: var(--chrome-fg);
  font-family: var(--proto); font-size: 13px; box-shadow: 0 8px 28px rgba(0,0,0,0.35); max-width: calc(100vw - 32px); }
.switcher button { background: transparent; border: 0; color: inherit; cursor: pointer; padding: 6px 10px; border-radius: 999px; }
.switcher button:hover { background: rgba(127,127,127,0.25); }
.switcher .lbl { padding: 0 8px; white-space: nowrap; }
.switcher .sep { width: 1px; height: 20px; background: var(--chrome-muted); opacity: 0.5; }

/* ---------- the app window ---------- */
.win { width: 1180px; height: 720px; background: var(--win); border: 1px solid var(--line); border-radius: 8px 8px 6px 6px; box-shadow: var(--shadow);
  display: grid; grid-template-rows: 34px minmax(0, 1fr); overflow: hidden; font-size: 13px; }
.titlebar { display: flex; align-items: center; gap: 8px; padding: 0 10px; border-bottom: 1px solid var(--line); font-size: 13px; }
.titlebar .appicon { width: 18px; height: 18px; }
.titlebar .t { flex: 1; text-align: center; font-weight: 500; color: var(--muted); }
.wbtns { display: flex; gap: 10px; }
.wbtns span { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid var(--faint); }
.body { min-height: 0; display: grid; }
.pane { background: var(--view); min-height: 0; min-width: 0; }
.scroll { overflow: auto; min-height: 0; }

/* shared bits */
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; }
.btn { border: 1px solid var(--line); background: var(--win); border-radius: 4px; padding: 4px 10px; cursor: pointer; font-size: 12.5px; line-height: 1.4; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.ghost { background: transparent; }
.btn.sm { padding: 2px 8px; font-size: 12px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; color: var(--muted); white-space: nowrap; }
.tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; letter-spacing: 0.02em; padding: 1px 6px; border-radius: 3px; white-space: nowrap; }
.tag.overdue { color: var(--neg); background: var(--neg-soft); }
.tag.due { color: var(--accent); background: var(--accent-soft); }
.tag.waiting { color: var(--wait); background: var(--wait-soft); }
.tag.plain { color: var(--muted); background: var(--cal); }
.banner { display: flex; align-items: center; gap: 10px; padding: 7px 12px; background: var(--wait-soft); border-bottom: 1px solid var(--line); font-size: 12.5px; }
.banner .grow { flex: 1; min-width: 0; }
.sechead { font-size: 11px; font-weight: 600; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.meta { font-size: 12px; color: var(--muted); line-height: 1.45; }
.row-title { font-weight: 500; }
.done-title { color: var(--muted); }
.strike { text-decoration: line-through; }

/* detail */
.detail { display: grid; gap: 12px; padding: 14px 16px; align-content: start; }
.detail h3 { margin: 0; font-size: 16px; line-height: 1.3; text-wrap: balance; }
.detail dl { margin: 0; display: grid; grid-template-columns: 92px 1fr; gap: 5px 10px; font-size: 12.5px; }
.detail dt { color: var(--muted); }
.detail dd { margin: 0; min-width: 0; }
.acts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.menu { position: absolute; z-index: 20; background: var(--view); border: 1px solid var(--line); border-radius: 5px; box-shadow: var(--shadow); padding: 4px; display: grid; min-width: 190px; }
.menu button { border: 0; background: transparent; text-align: left; padding: 5px 10px; border-radius: 3px; cursor: pointer; font-size: 12.5px; }
.menu button:hover { background: var(--accent-soft); }
.menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
.hist { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }

/* ---------- Variant A: calendar ---------- */
.A { grid-template-columns: 214px minmax(0, 1fr) 286px; }
.A .side { background: var(--win); border-right: 1px solid var(--line); padding: 12px; display: grid; gap: 16px; align-content: start; }
.mini { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; font-size: 11px; }
.mini .h { color: var(--faint); font-weight: 600; }
.mini .d { padding: 3px 0; border-radius: 3px; }
.mini .d.today { background: var(--accent); color: #fff; font-weight: 600; }
.mini .d.inview { background: var(--accent-soft); }
.lists { display: grid; gap: 4px; }
.lists label { display: flex; align-items: center; gap: 8px; padding: 3px 4px; border-radius: 3px; cursor: pointer; font-size: 12.5px; }
.lists label:hover { background: var(--cal); }
.lists .sub { font-size: 11px; color: var(--muted); margin-left: auto; }
.navlink { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 4px; cursor: pointer; border: 0; background: transparent; width: 100%; text-align: left; font-size: 12.5px; }
.navlink:hover, .navlink[aria-current="true"] { background: var(--accent-soft); }
.A .main { display: grid; grid-template-rows: auto auto minmax(0, 1fr); border-right: 1px solid var(--line); }
.toolbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--win); }
.toolbar .t { font-size: 15px; font-weight: 600; flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.seg button { border: 0; background: var(--win); padding: 3px 10px; font-size: 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.dayheads { display: grid; grid-template-columns: 52px repeat(3, 1fr); border-bottom: 1px solid var(--line); background: var(--view); }
.dayheads div { padding: 6px 8px; font-size: 12px; font-weight: 600; border-left: 1px solid var(--line); }
.dayheads div.today { color: var(--accent); }
.grid { display: grid; grid-template-columns: 52px repeat(3, 1fr); position: relative; }
.hours { position: relative; }
.hours span { position: absolute; right: 6px; font-size: 10.5px; color: var(--faint); transform: translateY(-6px); }
.col { position: relative; border-left: 1px solid var(--line); background-image: repeating-linear-gradient(to bottom, var(--line) 0 1px, transparent 1px 46px); background-position: 0 0; }
.col.past { background-color: rgba(127,127,127,0.035); }
.calblk { position: absolute; left: 3px; right: 3px; background: var(--cal); border-left: 3px solid var(--cal-edge); border-radius: 3px; font-size: 10.5px; color: var(--muted); padding: 2px 6px; text-align: right; overflow: hidden; }
.pill { position: absolute; height: 22px; border-radius: 4px; font-size: 11.5px; padding: 0 6px; display: flex; align-items: center; gap: 5px; cursor: pointer; overflow: hidden; white-space: nowrap; border: 1px solid transparent; text-align: left; }
.pill .tm { font-weight: 600; font-variant-numeric: tabular-nums; }
.pill.st-due { background: var(--lc-soft); border-color: var(--lc); color: var(--fg); }
.pill.st-overdue { background: var(--lc-soft); border-color: var(--neg); color: var(--fg); box-shadow: inset 3px 0 0 var(--neg); }
.pill.st-waiting { background: var(--wait-soft); border: 1px dashed var(--wait); color: var(--fg); }
.pill.st-expected { background: var(--view); border-color: var(--lc); color: var(--fg); }
.pill.st-tentative { background: var(--view); border: 1px dashed var(--lc); color: var(--muted); }
.pill.st-completed { background: transparent; border-color: var(--line); color: var(--muted); }
.pill.st-skipped { background: transparent; border-color: var(--line); color: var(--faint); text-decoration: line-through; }
.pill.st-missed { background: transparent; border: 1px solid var(--neg); color: var(--neg); }
.pill.st-nofire { background: transparent; border: 1px dotted var(--faint); color: var(--faint); height: 18px; font-size: 10.5px; }
.pill.sel { outline: 2px solid var(--accent); outline-offset: 1px; }
.nowline { position: absolute; left: 0; right: 0; height: 0; border-top: 2px solid var(--neg); z-index: 5; pointer-events: none; }
.nowline::before { content: ""; position: absolute; left: -5px; top: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--neg); }
.A .rail { background: var(--view); display: grid; grid-template-rows: minmax(0, 1fr); }
.railsec { display: grid; gap: 6px; padding: 12px 12px 4px; }
.orow { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 7px 8px; border-radius: 5px; cursor: pointer; border: 1px solid transparent; text-align: left; background: transparent; width: 100%; }
.orow:hover { background: var(--cal); }
.orow.sel { border-color: var(--accent); background: var(--accent-soft); }
.orow .dot { margin-top: 5px; }

/* ---------- Variant B: inbox ---------- */
.B { grid-template-columns: 188px minmax(0, 1fr) auto; }
.B .nav { background: var(--win); border-right: 1px solid var(--line); padding: 12px 10px; display: grid; gap: 14px; align-content: start; }
.B .main { display: grid; grid-template-rows: auto auto minmax(0, 1fr); }
.ribbon { padding: 12px 16px 10px; border-bottom: 1px solid var(--line); background: var(--view); display: grid; gap: 6px; }
.rib { position: relative; height: 54px; }
.rib .axis { position: absolute; left: 0; right: 0; top: 26px; border-top: 1px solid var(--line); }
.rib .day { position: absolute; top: 0; bottom: 0; border-left: 1px solid var(--line); font-size: 10.5px; color: var(--muted); padding-left: 4px; }
.rib .busy { position: absolute; top: 34px; height: 8px; background: var(--cal-edge); opacity: 0.45; border-radius: 2px; }
.rib .tick { position: absolute; top: 20px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; border: 2px solid var(--lc); background: var(--view); cursor: pointer; padding: 0; }
.rib .tick.st-due { background: var(--lc); }
.rib .tick.st-overdue { background: var(--neg); border-color: var(--neg); }
.rib .tick.st-waiting { border-style: dashed; border-color: var(--wait); }
.rib .tick.st-completed { background: var(--pos); border-color: var(--pos); width: 8px; height: 8px; margin-left: -4px; top: 22px; }
.rib .tick.st-skipped { border-color: var(--faint); width: 8px; height: 8px; margin-left: -4px; top: 22px; }
.rib .tick.st-missed { border-color: var(--neg); background: var(--view); }
.rib .tick.st-nofire { border: 1px dotted var(--faint); width: 8px; height: 8px; margin-left: -4px; top: 22px; }
.rib .tick.st-tentative { border-style: dashed; }
.rib .now { position: absolute; top: 12px; bottom: 6px; border-left: 2px solid var(--neg); }
.rib .now span { position: absolute; top: -12px; left: -16px; font-size: 10px; color: var(--neg); font-weight: 600; }
.inbox { padding: 6px 16px 24px; display: grid; gap: 18px; align-content: start; }
.igroup { display: grid; gap: 2px; }
.irow { display: grid; grid-template-columns: 48px 10px minmax(0, 1fr) auto; gap: 10px; align-items: center; padding: 8px 8px; border-radius: 5px; border: 1px solid transparent; cursor: pointer; }
.irow:hover { background: var(--cal); }
.irow.sel { border-color: var(--accent); background: var(--accent-soft); }
.irow .tm { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; }
.drawer { width: 320px; border-left: 1px solid var(--line); background: var(--view); display: grid; grid-template-rows: auto minmax(0, 1fr); }
.drawer-head { display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-bottom: 1px solid var(--line); }

/* ---------- Variant C: agenda ---------- */
.C { grid-template-rows: auto auto minmax(0, 1fr); }
.chead { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 14px; padding: 12px 20px 10px; background: var(--win); border-bottom: 1px solid var(--line); }
.chead .date { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
.chead .grow { flex: 1; }
.fchip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--view); font-size: 12px; cursor: pointer; }
.fchip[aria-pressed="false"] { opacity: 0.45; }
.nowband { display: flex; gap: 8px; padding: 10px 20px; background: var(--view); border-bottom: 1px solid var(--line); overflow-x: auto; align-items: stretch; }
.nowband .lbl { font-size: 11px; font-weight: 700; letter-spacing: 0.07em; color: var(--neg); text-transform: uppercase; align-self: center; padding-right: 4px; white-space: nowrap; }
.ncard { display: grid; gap: 2px; min-width: 190px; max-width: 230px; padding: 7px 10px; border-radius: 6px; border: 1px solid var(--line); border-left: 4px solid var(--lc); background: var(--win); cursor: pointer; text-align: left; }
.ncard.st-overdue { border-left-color: var(--neg); }
.ncard.st-waiting { border-left-style: dashed; border-left-color: var(--wait); }
.ncard.sel { box-shadow: 0 0 0 2px var(--accent); }
.agenda { max-width: 760px; margin: 0 auto; padding: 4px 20px 40px; }
.dhead { position: sticky; top: 0; z-index: 3; background: var(--view); padding: 14px 0 6px; font-size: 13px; font-weight: 700; display: flex; gap: 8px; align-items: baseline; border-bottom: 1px solid var(--line); }
.arow { display: grid; grid-template-columns: 54px 22px minmax(0, 1fr) auto; gap: 8px; align-items: start; padding: 8px 6px; border-bottom: 1px solid var(--cal); cursor: pointer; }
.arow:hover { background: var(--cal); }
.arow.sel { background: var(--accent-soft); }
.arow .tm { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 12px; padding-top: 1px; }
.arow.cal { cursor: default; color: var(--muted); }
.arow.cal:hover { background: transparent; }
.glyph { width: 16px; height: 16px; display: inline-grid; place-items: center; margin-top: 1px; }
.nowrule { display: flex; align-items: center; gap: 8px; color: var(--neg); font-size: 11px; font-weight: 700; padding: 6px 0; }
.nowrule::after { content: ""; flex: 1; border-top: 2px solid var(--neg); }
.expand { grid-column: 3 / -1; margin-top: 4px; border: 1px solid var(--line); border-radius: 6px; background: var(--win); cursor: default; }

/* ---------- not time-based table (shared) ---------- */
.ntb { padding: 16px; display: grid; gap: 10px; align-content: start; }
.ntb table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.ntb th { text-align: left; font-weight: 600; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--line); }
.ntb td { padding: 8px; border-bottom: 1px solid var(--cal); vertical-align: top; }
.fake { font-size: 11px; padding: 1px 6px; border-radius: 3px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.fake.easy { border-color: var(--neg); color: var(--neg); }
.fake.moderate { border-color: var(--wait); color: var(--wait); }

/* ---------- tray ---------- */
.panel { width: 1180px; height: 38px; border-radius: 6px; background: var(--win); border: 1px solid var(--line); display: flex; align-items: center; justify-content: flex-end; gap: 14px; padding: 0 12px; position: relative; font-size: 12.5px; }
.panel .ticon { width: 16px; height: 16px; border-radius: 3px; background: var(--faint); opacity: 0.6; }
.trayme { position: relative; border: 0; background: transparent; padding: 2px; cursor: pointer; display: grid; place-items: center; }
.trayme .badge { position: absolute; top: -5px; right: -7px; min-width: 15px; height: 15px; border-radius: 8px; background: var(--neg); color: #fff; font-size: 9.5px; font-weight: 700; display: grid; place-items: center; padding: 0 3px; }
.traymenu { position: absolute; right: 70px; bottom: 44px; width: 300px; background: var(--view); border: 1px solid var(--line); border-radius: 6px; box-shadow: var(--shadow); padding: 6px; display: grid; font-size: 12.5px; z-index: 30; }
.traymenu .mi { display: flex; justify-content: space-between; gap: 8px; padding: 5px 10px; border-radius: 3px; border: 0; background: transparent; text-align: left; cursor: pointer; width: 100%; }
.traymenu .mi:hover { background: var(--accent-soft); }
.traymenu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; }
.traymenu .cap { font-size: 11px; color: var(--muted); padding: 4px 10px 2px; font-weight: 600; letter-spacing: 0.05em; text-transform: uppercase; }
/* ---------- version 2: one window, four views ---------- */
.shell { grid-template-columns: 200px minmax(0, 1fr); }
.shell .side { background: var(--win); border-right: 1px solid var(--line); padding: 12px; display: grid; gap: 16px; align-content: start; overflow: auto; }
.shell .main { display: grid; grid-template-rows: auto auto minmax(0, 1fr); min-width: 0; min-height: 0; }

function metaLine(o) {
  const bits = [];
  if (o.st === "completed") bits.push(`${o.by === "You" ? "You" : o.by} completed it at ${o.at}`);
  if (o.st === "skipped") bits.push(`Skipped by ${o.by === "You" ? "you" : o.by}${o.note ? `: "${o.note}"` : ""}`);

  if (o.claim) bits.push(o.claim === "You" ? `You claimed it` : `${o.claim} claimed it at ${o.claimAt}`);

  if (o.snoozed) bits.push(`Snoozed until ${o.snoozed}`);
  if (o.declined && o.declined.length) bits.push(`${o.declined.join(", ")} can't this time`);
  if (o.why) bits.push(o.why);
  if (o.undone) bits.push("Undone");
  return bits.join(" · ");

function useOccurrences() {
  const [occ, setOcc] = useState(INITIAL.map((o) => ({ ...o })));
  const act = (id, kind, arg) => setOcc((all) => all.map((o) => {
    if (o.id !== id) return o;
    const prev = o.prev || { ...o };
    switch (kind) {
      case "done": return { ...o, prev, st: "completed", by: "You", at: fmt(NOW.m), snoozed: null, since: null, why: null, undone: false };
      case "done-early": return { ...o, prev, st: "completed", by: "You", at: "Wed " + fmt(NOW.m), why: "Completed early" };
      case "skip": return { ...o, prev, st: "skipped", by: "You", note: arg || null, snoozed: null, since: null, why: null };
      case "snooze": return { ...o, prev, snoozed: arg };
      case "claim": return { ...o, prev, claim: "You", claimAt: fmt(NOW.m) };
      case "release": return { ...o, prev, claim: null };
      case "decline": return { ...o, prev, declined: [...(o.declined || []), "You"] };
      case "stopwait": return { ...o, prev, st: "nofire", why: "You stopped the wait" };
      case "undo": return { ...o.prev, prev: null, undone: true };
      default: return o;
    }
  }));
  return [occ, act];
}

function Actions({ o, act, compact }) {

    </div>`;
  }
  if (o.st === "waiting") {
    return html`<div class="acts" onClick=${(e) => e.stopPropagation()}>
      <button class=${cls} onClick=${() => act(o.id, "done")}>Done anyway</button>

  }
  if (o.st === "expected" || o.st === "tentative") {
    return html`<div class="acts" onClick=${(e) => e.stopPropagation()}>
      <button class=${cls} onClick=${() => act(o.id, "done-early")}>Complete early</button>

      ${r.shared ? html`<button class=${cls + " ghost"} onClick=${() => act(o.id, "decline")}>I can't</button>` : null}
    </div>`;
  }
  if (o.st === "completed" || o.st === "skipped" || o.st === "missed" || (o.st === "nofire" && o.prev)) {
    return html`<div class="acts" onClick=${(e) => e.stopPropagation()}>

    </div>`;
  }
  return null;
}

  lawn: ["paused", "Paused for everyone until Monday 5 October"], passport: ["finished", "Finished Monday 28 September, by you"],
};
const COLS = [["overdue", "Overdue"], ["due", "Due"], ["waiting", "Waiting"], ["expected", "Expected"], ["watching", "Watching"], ["paused", "Paused"], ["finished", "Finished"]];
const boardItems = (occ) => Object.keys(R).map((id) => {
  const open = occ.find((o) => o.r === id && ["overdue", "due", "waiting"].includes(o.st));
  if (open) return { id, col: open.st, line: metaLine(open) || `${stateWord[open.st]} since ${fmt(open.m)}`, o: open };
  const s = BOARD_STATIC[id];
  return { id, col: s[0], line: s[1], o: null };
});
const passes = (f, id) => !f.lists[R[id].list] && !f.pris[R[id].pri];
const visible = (occ, f) => occ.filter((o) => passes(f, o.r));
const openOf = (occ, st) => occ.filter((o) => o.st === st);
const HOUR = 46, START = 6;
function lanes(items) {
  const sorted = [...items].sort((a, b) => a.m - b.m);
  const ends = [];
  sorted.forEach((o) => {
    const top = (o.m - START * 60) / 60 * HOUR;
    let lane = ends.findIndex((e) => e <= top);
    if (lane === -1) { lane = ends.length; ends.push(0); }
    ends[lane] = top + 24;
    o._lane = lane;
  });
  return { items: sorted, n: Math.max(1, ends.length) };
}

// ---------- Calendar view ----------

  const hours = []; for (let i = START; i <= 23; i++) hours.push(i);
  return html`<div class="calview">
    <div style="display: grid; grid-template-rows: auto minmax(0, 1fr); min-height: 0; background: var(--view);">
      <div class="dayheads">${["", "-1", "0", "1"].map((k, i) => i === 0 ? html`<div style="border-left: 0;"></div>` : html`<div class=${k === "0" ? "today" : ""}>${SHORT[k]}${k === "0" ? " · Today" : ""}</div>`)}</div>
      <div class="scroll" ref=${scroller}>
        <div class="grid" style=${`height: ${(24 - START) * HOUR}px;`}>
          <div class="hours">${hours.map((hh) => html`<span class="tnum" style=${`top: ${(hh - START) * HOUR}px`}>${hh === START ? "" : fmt(hh * 60)}</span>`)}</div>
          ${[-1, 0, 1].map((d) => {
            const { items, n } = lanes(occ.filter((o) => o.d === d));
            return html`<div class=${"col" + (d < 0 ? " past" : "")}>
              ${CAL.filter((c) => c.d === d).map((c) => html`<div class="calblk" style=${`top: ${(c.s / 60 - START) * HOUR}px; height: ${(c.e - c.s) / 60 * HOUR}px;`}>${c.t} · ${fmt(c.s)}</div>`)}
              ${items.map((o) => html`<button class=${`pill st-${o.st}` + (sel === o.id ? " sel" : "")} style=${lcStyle(R[o.r].list) + `top: ${(o.m / 60 - START) * HOUR}px; left: calc(4px + ${o._lane} * (86% / ${n})); width: calc(86% / ${n} - 3px);`}
                onClick=${() => setSel(o.id)} title=${`${R[o.r].title} · ${stateWord[o.st]}`}>
                <span class="tm">${fmt(o.m)}</span><span>${o.st === "nofire" ? "didn't fire: " : ""}${R[o.r].title}</span></button>`)}

      ${selO ? html`<div><div style="padding: 8px 12px 0;"><button class="btn sm ghost" onClick=${() => setSel(null)}>‹ Open occurrences</button></div><${Detail} o=${selO} act=${act}/></div>` : html`<div>
        ${[["overdue", "Overdue"], ["due", "Due"], ["waiting", "Waiting"]].map(([st, name]) => html`<div class="railsec">
          <div class="sechead">${name}<span class="muted">${openOf(occ, st).length}</span></div>
          ${openOf(occ, st).map((o) => html`<button class=${"orow" + (sel === o.id ? " sel" : "")} onClick=${() => setSel(o.id)}>
            <span class="dot" style=${`background: ${lc(R[o.r].list)}`}></span>
            <span style="min-width: 0;"><div class="row-title">${R[o.r].title}</div><div class="meta">${metaLine(o)}</div></span>

}

};
function App() {
  const [view, setViewRaw] = useState(readView());
  const [occ, act] = useOccurrences();
  const [filt, setFilt] = useState({ lists: {}, pris: {} });
  const [sel, setSel] = useState(null);
  const [tray, setTray] = useState(false);
  const [tip, setTip] = useState(true);
  const setView = (k) => { setViewRaw(k); setSel(null); try { history.replaceState(null, "", "#" + k); } catch (e) {} try { localStorage.setItem("proto-last-view", k); } catch (e) {} };
  const idx = VIEWS.findIndex((x) => x.k === view);
  const step = (n) => setView(VIEWS[(idx + n + VIEWS.length) % VIEWS.length].k);
  useEffect(() => {
    const onKey = (e) => { const t = e.target; if (t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable)) return; if (e.key === "ArrowLeft") step(-1); if (e.key === "ArrowRight") step(1); };
    const onHash = () => setViewRaw(readView());
    window.addEventListener("keydown", onKey); window.addEventListener("hashchange", onHash);
    return () => { window.removeEventListener("keydown", onKey); window.removeEventListener("hashchange", onHash); };
  });
  return html`
    <header class="proto-head">
      <div class="proto-eyebrow">Throwaway prototype, version 2 · csnook/hab-bot#26 · sample data</div>
      <h1>Reminders desktop window</h1>
      <p>The three layouts from version 1 are now views of one window, switched from the toolbar. A fourth view, Board, shows every reminder in columns by status, so waiting, paused and not-time-based reminders can be found and edited. The lists and priorities on the left filter every view. The window opens on the view you used last, and a first-run tip points at the switcher.</p>
      <p>It is Wednesday 30 September at 17:40. Click occurrences and cards to act on them. Done, Snooze, Claim, Skip and Undo change the page, and nothing is saved. Not covered yet: the reminder editor, the snooze-all and sharing dialogs, and the account, server and retention settings.</p>
    </header>
    <div class="desk-scroll"><div class="desk">
      <div class="win" role="application" aria-label="Reminders window">
        <div class="titlebar"><${AppIcon}/><span class="t">Reminders</span><span class="wbtns" aria-hidden="true"><span></span><span></span><span></span></span></div>
        <${Window} occ=${occ} act=${act} filt=${filt} setFilt=${setFilt} sel=${sel} setSel=${setSel} view=${view} setView=${setView} tip=${tip} setTip=${setTip}/>
      </div>
      <${Tray} occ=${occ} open=${tray} setOpen=${setTray}/>
    </div></div>
    <div class="switcher" role="toolbar" aria-label="Prototype controls">
      <button onClick=${() => step(-1)} aria-label="Previous view">←</button>
      <span class="lbl">${VIEWS[idx].name}</span>
      <button onClick=${() => step(1)} aria-label="Next view">→</button>
      <span class="sep"></span>
      <button onClick=${() => setTip(!tip)} aria-pressed=${tip}>First-run tip</button>
      <button onClick=${() => setTray(!tray)} aria-pressed=${tray}>Tray menu</button>
    </div>`;
}
render(html`<${App}/>`, document.getElementById("app"));
</script>

</body>
</html>
