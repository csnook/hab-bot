[package]
name = "hab-client"
description = "The app side of joining a server: pinned TLS, OPAQUE registration, keys and the key store"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
hab-proto = { path = "../proto" }
hab-core = { path = "../core" }
base64 = "0.22"
bip39 = "2"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
oo7 = { version = "0.5", default-features = false, features = ["tokio", "native_crypto"] }
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
tokio = { version = "1", features = ["rt", "net", "time", "io-util", "sync", "macros"] }
webpki-roots = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
zxcvbn = "3"

[dev-dependencies]
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
hab-server = { path = "../server" }
rusqlite = { version = "0.32", features = ["bundled"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
